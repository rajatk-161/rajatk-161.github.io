  text{font-family:'IBM Plex Sans','Helvetica Neue',Helvetica,Arial,sans-serif;fill:var(--ink);font-size:15px}
  .muted{fill:var(--muted)} .small{font-size:13.5px} .label{font-size:16px;font-weight:500}
  .axis{stroke:var(--muted);stroke-width:1.2;fill:none}
  .ink{stroke:var(--ink)}
</style>
