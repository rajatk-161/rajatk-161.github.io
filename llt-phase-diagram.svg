<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" role="img" aria-labelledby="t d">
<title id="t">Schematic phase diagram of supercooled water</title>
<desc id="d">A liquid-liquid transition line ends at a critical point near 170 MPa and 181 K; its continuation is the Widom line. Ice crystallization is fastest along this band.</desc>
